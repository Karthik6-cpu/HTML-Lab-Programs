<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Alert Example</title>
</head>
<body>

    <h2>Click the button to call the function</h2>

    
    <button onclick="showMessage()">Click Me</button>

    <script>
    
        function showMessage() {
            alert("This alert is coming from a JavaScript function!");
        }
    </script>

</body>
</html>
