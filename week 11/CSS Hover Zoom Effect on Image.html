<!DOCTYPE html>
<html>
<head>
    <title>Image Zoom</title>
    <style>
        img {
            width: 200px;
            transition: transform 1s;
        }
        img:hover {
            transform: scale(1.5);
        }
    </style>
</head>
<body>
    <h2>Image Zoom Animation</h2>
    <img src="flower.jpg" alt="Flower">
</body>
</html>
