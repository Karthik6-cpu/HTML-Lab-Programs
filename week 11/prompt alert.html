<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Alert Example</title>
</head>
<body>

    <h2>JavaScript Prompt Example</h2>

    <script>
        function askName() {
            let userName = prompt("Please enter your name:");
            if (userName) {
                alert("Hello, " + userName + "!");
            } else {
                alert("Hello, Guest!");
            }
        }

        askName();
    </script>

</body>
</html>
