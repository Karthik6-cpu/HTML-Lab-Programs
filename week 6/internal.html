<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal CSS</title> 
    <style>
        body{
            background-color: rgb(243, 241, 239); 
            text-align: center; 
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }
        #h1{
            color: blue; 
            font-family: 'Courier New', Courier, monospace;
        }
        #h2{
            color : green
        }
        #p{
          color: black;
          font-size: 18px;
        }
        #p1{
            color: brown; 
            font-size: 16px;
        } 
        .ul{
            text-align: left; 
            color: darkgreen;
        } 
        .ol{
            text-align: left; 
            color: darkred;
        } 
        .div{
            background-color: white; 
            margin: 20px; 
            padding: 15px; 
            border: 2px solid black;
        }
    </style>
</head>

<body>

    <h1 id="h1">
        Welcome to My Web Page
    </h1>

    <h2 id="h2">About Me</h2>

    <p id="p">
        This is a simple HTML page with inline CSS.
    </p>

    <p id="p1">
        I am learning <b style="color: red;">HTML</b> and
        <i style="color: blue;">CSS</i>.
    </p>

    <hr style="border: 2px solid darkblue;">

    <h3 style="color: purple;">My Skills</h3>

    <ul class="ul">
        <li style="margin: 5px;">HTML</li>
        <li style="margin: 5px;">CSS</li>
        <li style="margin: 5px;">Python</li>
    </ul>

    <h3 style="color: purple;">My Hobbies</h3>

    <ol class="ol">
        <li style="margin: 5px;">Reading</li>
        <li style="margin: 5px;">Coding</li>
        <li style="margin: 5px;">Listening to Music</li>
    </ol>

    <br>

    <a href="https://www.google.com"
       style="color: blue; font-size: 18px; text-decoration: none;">
        Visit Google
    </a>

    <div class = "div">
        <h3 style="color: darkblue;">Thank You</h3>
        <p style="color: black;">Have a nice day!</p>
    </div>

</body>
</html>
